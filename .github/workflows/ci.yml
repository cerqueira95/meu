name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Check server functions
        run: node --check api/health.js && node --check api/auth/login.js && node --check api/auth/me.js && node --check api/auth/logout.js && node --check api/auth/quick-login.js && node --check api/_lib/db.js && node --check api/_lib/session.js && node --check api/users/index.js && node --check api/users/update.js && node --check api/news/index.js && node --check api/news/comment.js && node --check api/news/react.js
