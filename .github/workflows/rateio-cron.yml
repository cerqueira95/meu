name: Coleta diária WMS

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  coletar-rateio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar coleta do Warehouse
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            --retry 2 \
            --retry-delay 15 \
            --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://warehouse-orion.onrender.com/api/cron/rateio
